name: Generate Android Splash

on:
  push:
    branches:
      - feat/ta-032-splash-screen
    paths:
      - pubspec.yaml
      - assets/branding/app_icon_master.png
      - .github/workflows/generate-splash.yml

permissions:
  contents: write

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, 'chore: generate Android splash assets [TA-032]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Commit generated splash assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock android/app/src/main/res android/app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then
            echo "No generated splash changes."
            exit 0
          fi
          git commit -m "chore: generate Android splash assets [TA-032]"
          git push origin HEAD:feat/ta-032-splash-screen
