name: Regenerate Safe Splash

on:
  push:
    branches:
      - fix/update-app-icon-and-splash-source
    paths:
      - pubspec.yaml
      - assets/branding/app_icon_master.png
      - .github/workflows/regenerate-safe-splash.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, 'fix: regenerate safe splash assets')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Build safe-area splash image
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image

          src = 'assets/branding/app_icon_master.png'
          out = 'assets/branding/splash_icon.png'

          im = Image.open(src).convert('RGBA')
          bbox = im.getchannel('A').getbbox()
          if not bbox:
              raise SystemExit('app_icon_master.png has no visible pixels')

          art = im.crop(bbox)

          canvas_size = 1152
          safe_size = 540
          scale = min(safe_size / art.width, safe_size / art.height)
          new_size = (
              max(1, round(art.width * scale)),
              max(1, round(art.height * scale)),
          )

          art = art.resize(new_size, Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (canvas_size, canvas_size), (0, 0, 0, 0))
          x = (canvas_size - art.width) // 2
          y = (canvas_size - art.height) // 2
          canvas.alpha_composite(art, (x, y))
          canvas.save(out, optimize=True)

          print(f'Created {out}: canvas={canvas.size}, artwork={art.size}, offset={(x, y)}')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate native splash
        run: dart run flutter_native_splash:create

      - name: Commit safe splash assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/splash_icon.png pubspec.lock android/app/src/main/res
          if git diff --cached --quiet; then
            echo "No splash changes."
            exit 0
          fi
          git commit -m "fix: regenerate safe splash assets"
          git push origin HEAD:fix/update-app-icon-and-splash-source
