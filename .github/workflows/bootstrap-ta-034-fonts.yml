name: Bootstrap TA-034 fonts

on:
  push:
    branches:
      - feat/ta-034-typography

permissions:
  contents: write

jobs:
  add-fonts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/ta-034-typography

      - name: Download official Fredoka and Nunito font files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets/fonts/fredoka assets/fonts/nunito

          curl -L --fail \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf" \
            -o assets/fonts/fredoka/Fredoka-Variable.ttf

          curl -L --fail \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/OFL.txt" \
            -o assets/fonts/fredoka/OFL.txt

          curl -L --fail \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
            -o assets/fonts/nunito/Nunito-Variable.ttf

          curl -L --fail \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/OFL.txt" \
            -o assets/fonts/nunito/OFL.txt

          test -s assets/fonts/fredoka/Fredoka-Variable.ttf
          test -s assets/fonts/nunito/Nunito-Variable.ttf

      - name: Commit bundled fonts and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/bootstrap-ta-034-fonts.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/fonts .github/workflows/bootstrap-ta-034-fonts.yml
          git commit -m "chore: bundle Fredoka and Nunito fonts [TA-034]"
          git push origin HEAD:feat/ta-034-typography
