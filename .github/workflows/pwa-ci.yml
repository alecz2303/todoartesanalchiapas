name: PWA CI
on:
  push:
    branches: [feat/pwa-react-rebuild]
  pull_request:
    paths: ['src/**','public/**','package.json','package-lock.json','vite.config.ts','tsconfig*.json','index.html']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
