name: Generate Android App Icon

on:
  push:
    branches:
      - feat/ta-031-app-icon
    paths:
      - pubspec.yaml
      - assets/branding/app_icon_master.png
      - .github/workflows/generate-app-icon.yml

permissions:
  contents: write

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, 'chore: generate Android launcher assets [TA-031]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Commit generated Android icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock android/app/src/main/res
          if git diff --cached --quiet; then
            echo "No generated icon changes."
            exit 0
          fi
          git commit -m "chore: generate Android launcher assets [TA-031]"
          git push origin HEAD:feat/ta-031-app-icon
